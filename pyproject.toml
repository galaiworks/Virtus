[project]
name = "virtus"
version = "0.1.0"
description = "Virtus - 8 体の AI エージェントチームによる集客→営業→クロージング自動化"
requires-python = ">=3.11"
authors = [{ name = "galaiworks" }]
license = { text = "Proprietary" }

dependencies = [
    "anthropic>=0.39.0",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --strict-markers"
